<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Loyalty Card</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-stone-50 text-stone-900 font-sans min-h-screen flex flex-col justify-between">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [view, setView] = React.useState('home'); 
            const [mobile, setMobile] = React.useState('');
            const [pin, setPin] = React.useState('');
            const [mobileError, setMobileError] = React.useState('');
            
            const [secretInput, setSecretInput] = React.useState('');
            const [adminPinConfig, setAdminPinConfig] = React.useState('99885656800');
            const [currentAdminPassword, setCurrentAdminPassword] = React.useState('');
            const [newAdminPassword, setNewAdminPassword] = React.useState('');

            const [config, setConfig] = React.useState(() => {
                const saved = localStorage.getItem('loyalty_master_config');
                return saved ? JSON.parse(saved) : {
                    brandName: "The Copper Skillet",
                    heroBadgeText: "10 stamps = Free Reward",
                    heroTitle: "Craft food, warm welcome — every visit counts.",
                    heroSubtitle: "Collect a stamp on every visit, and your 10th one is on us.",
                    logoUrl: "https://images.unsplash.com/photo-1550547660-d9450f859349?w=100&auto=format&fit=crop&q=80",
                    heroBgUrl: "https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1200&auto=format&fit=crop&q=80",
                    footerText: "© 2026 Digital Loyalty Card. All rights reserved.",
                    stampIcon: "★",
                    rewardIcon: "🎁"
                };
            });

            const [customers, setCustomers] = React.useState(() => {
                const saved = localStorage.getItem('loyalty_customers');
                return saved ? JSON.parse(saved) : {};
            });

            const [searchTerm, setSearchTerm] = React.useState('');

            React.useEffect(() => {
                localStorage.setItem('loyalty_master_config', JSON.stringify(config));
            }, [config]);

            React.useEffect(() => {
                localStorage.setItem('loyalty_customers', JSON.stringify(customers));
            }, [customers]);

            const validateMobile = (num) => {
                const regex = /^[6-9]\d{9}$/;
                return regex.test(num);
            };

            const handleCustomerLogin = (e) => {
                e.preventDefault();
                if (!validateMobile(mobile)) {
                    setMobileError('Please enter a valid mobile number starting with 6, 7, 8, or 9.');
                    return;
                }
                if (!pin || pin.length !== 4) {
                    alert('Please enter a valid 4-digit PIN.');
                    return;
                }
                setMobileError('');
                
                if (!customers[mobile]) {
                    setCustomers(prev => ({
                        ...prev,
                        [mobile]: { pin: pin, stamps: 0, history: [] }
                    }));
                } else if (customers[mobile].pin !== pin) {
                    alert('Incorrect PIN! Please try again.');
                    return;
                }
                setView('userDashboard');
            };

            const updateStamps = (mob, delta) => {
                setCustomers(prev => {
                    const current = prev[mob] || { pin: '1234', stamps: 0, history: [] };
                    const newStamps = Math.max(0, Math.min(10, current.stamps + delta));
                    return {
                        ...prev,
                        [mob]: {
                            ...current,
                            stamps: newStamps,
                            history: [...current.history, { date: new Date().toLocaleString(), delta }]
                        }
                    };
                });
            };

            const resetCard = (mob) => {
                setCustomers(prev => ({
                    ...prev,
                    [mob]: { ...prev[mob], stamps: 0, history: [...prev[mob].history, { date: new Date().toLocaleString(), delta: 'Reset' }] }
                }));
            };

            const deleteCustomer = (mob) => {
                if (confirm(`Are you sure you want to permanently delete ${mob}?`)) {
                    setCustomers(prev => {
                        const updated = { ...prev };
                        delete updated[mob];
                        return updated;
                    });
                }
            };

            const handleSecretLogin = () => {
                if (secretInput === '7013557763') {
                    setView('masterPanel');
                    setSecretInput('');
                } else if (secretInput === adminPinConfig) {
                    setView('adminPanel');
                    setSecretInput('');
                } else {
                    alert('Incorrect passcode!');
                }
            };

            const handleUpdateAdminPassword = (e) => {
                e.preventDefault();
                if (currentAdminPassword !== adminPinConfig) {
                    alert('Current admin password is incorrect!');
                    return;
                }
                if (!newAdminPassword || newAdminPassword.length < 4) {
                    alert('New password must be at least 4 digits.');
                    return;
                }
                setAdminPinConfig(newAdminPassword);
                setCurrentAdminPassword('');
                setNewAdminPassword('');
                alert('Admin password successfully updated!');
            };

            return (
                <div className="min-h-screen flex flex-col justify-between bg-stone-100">
                    <header className="bg-white border-b px-6 py-3 flex justify-between items-center shadow-sm">
                        <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setView('home')}>
                            <img src={config.logoUrl} alt="Logo" className="w-10 h-10 rounded-full object-cover border"/>
                            <div>
                                <span className="text-sm font-bold block text-stone-900">{config.brandName}</span>
                                <span className="text-xs text-stone-500 block">Digital Loyalty Card</span>
                            </div>
                        </div>
                        <div>
                            <button 
                                onClick={() => setView('loginModal')} 
                                className="w-8 h-8 rounded-full bg-stone-900 text-white flex items-center justify-center font-bold text-xs hover:bg-stone-800 shadow transition"
                                title="Admin Login"
                            >
                                A
                            </button>
                        </div>
                    </header>

                    <main className="flex-grow flex items-center justify-center p-4">
                        {view === 'home' && (
                            <div className="max-w-5xl w-full grid grid-cols-1 md:grid-cols-2 bg-white rounded-2xl shadow-xl overflow-hidden border border-stone-200">
                                <div className="relative bg-stone-900 min-h-[300px] md:min-h-[500px] bg-cover bg-center flex flex-col justify-between p-8 text-white" style={{ backgroundImage: `url(${config.heroBgUrl})` }}>
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent"></div>
                                    <div className="relative z-10 flex items-center space-x-3">
                                        <img src={config.logoUrl} alt="Logo" className="w-12 h-12 rounded-full object-cover border-2 border-white shadow-md"/>
                                        <span className="font-bold text-lg tracking-wide">{config.brandName}</span>
                                    </div>
                                    <div className="relative z-10 space-y-3">
                                        <div className="inline-block bg-orange-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow">
                                            {config.heroBadgeText}
                                        </div>
                                        <h1 className="text-2xl md:text-3xl font-extrabold leading-tight">{config.heroTitle}</h1>
                                        <p className="text-stone-200 text-sm">{config.heroSubtitle}</p>
                                    </div>
                                </div>

                                <div className="p-8 md:p-12 flex flex-col justify-center space-y-6 bg-white">
                                    <div className="space-y-2">
                                        <h2 className="text-2xl font-bold text-stone-900">Welcome Back</h2>
                                        <p className="text-xs text-stone-500 leading-relaxed">
                                            Enter your 10-digit mobile number and 4-digit PIN to open your loyalty card.
                                        </p>
                                    </div>

                                    <form onSubmit={handleCustomerLogin} className="space-y-4">
                                        <div className="space-y-1">
                                            <label className="text-xs font-bold uppercase tracking-wider text-stone-600">Mobile Number</label>
                                            <div className="relative">
                                                <span className="absolute inset-y-0 left-0 pl-3 flex items-center text-stone-400">📞</span>
                                                <input 
                                                    type="tel" 
                                                    placeholder="10-digit mobile number" 
                                                    value={mobile} 
                                                    onChange={(e) => setMobile(e.target.value.replace(/\D/g, '').slice(0, 10))}
                                                    className="w-full pl-10 pr-4 py-3 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition"
                                                    maxLength="10"
                                                    required
                                                />
                                            </div>
                                            {mobileError && <span className="text-red-500 text-[11px] font-semibold px-1">{mobileError}</span>}
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-xs font-bold uppercase tracking-wider text-stone-600">4-Digit PIN</label>
                                            <input 
                                                type="password" 
                                                placeholder="Enter 4-digit PIN" 
                                                value={pin} 
                                                onChange={(e) => setPin(e.target.value.replace(/\D/g, '').slice(0, 4))}
                                                className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition"
                                                maxLength="4"
                                                required
                                            />
                                        </div>

                                        <button 
                                            type="submit" 
                                            className="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-orange-500/20 transition flex items-center justify-center space-x-2 text-sm"
                                        >
                                            <span>View My Loyalty Card</span>
                                            <span>→</span>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {view === 'loginModal' && (
                            <div className="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl space-y-5 border border-stone-200">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h2 className="text-lg font-bold text-stone-900">Admin Portal</h2>
                                    <button onClick={() => setView('home')} className="text-xs font-semibold text-red-500 hover:underline">Back</button>
                                </div>
                                <p className="text-xs text-stone-500">Enter your secure passcode:</p>
                                <input 
                                    type="password" 
                                    placeholder="Enter Passcode..." 
                                    value={secretInput} 
                                    onChange={(e) => setSecretInput(e.target.value)}
                                    className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                                />
                                <button onClick={handleSecretLogin} className="w-full bg-stone-900 hover:bg-stone-800 text-white p-3 rounded-xl font-bold text-sm transition">
                                    Login
                                </button>
                            </div>
                        )}

                        {view === 'userDashboard' && customers[mobile] && (
                            <div className="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-stone-200">
                                <div className="bg-gradient-to-r from-orange-600 to-amber-600 text-white p-6 relative">
                                    <div className="flex justify-between items-start mb-4">
                                        <div>
                                            <h2 className="text-xl font-bold">My Loyalty Card</h2>
                                            <p className="text-xs text-orange-100 mt-0.5">One stamp per visit — 10 stamps unlock your free reward.</p>
                                        </div>
                                        <button onClick={() => setView('home')} className="text-xs font-semibold bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg backdrop-blur-sm transition">
                                            Switch User
                                        </button>
                                    </div>
                                    <div className="space-y-2 mt-4">
                                        <div className="flex justify-between text-xs font-semibold">
                                            <span>{customers[mobile].stamps} / 10 stamps collected</span>
                                            <span>{Math.round((customers[mobile].stamps / 10) * 100)}%</span>
                                        </div>
                                        <div className="w-full bg-black/20 h-2 rounded-full overflow-hidden">
                                            <div className="bg-white h-full transition-all duration-500 rounded-full" style={{ width: `${(customers[mobile].stamps / 10) * 100}%` }}></div>
                                        </div>
                                        <p className="text-[11px] text-orange-100 pt-1">Account: {mobile}</p>
                                    </div>
                                </div>

                                <div className="p-6 space-y-6 bg-white">
                                    <div className="grid grid-cols-5 gap-3">
                                        {[...Array(10)].map((_, idx) => {
                                            const isStamped = idx < customers[mobile].stamps;
                                            const isReward = idx === 9;
                                            return (
                                                <div 
                                                    key={idx} 
                                                    className={`h-14 rounded-xl flex items-center justify-center font-bold text-sm border transition-all ${
                                                        isStamped 
                                                            ? 'bg-amber-500 text-white border-amber-600 shadow-md shadow-amber-500/20 scale-105' 
                                                            : 'bg-stone-50 text-stone-300 border-dashed border-stone-200'
                                                    }`}
                                                >
                                                    {isReward && !isStamped ? (config.rewardIcon || '🎁') : isStamped ? (config.stampIcon || '★') : idx + 1}
                                                </div>
                                            );
                                        })}
                                    </div>
                                    <p className="text-[11px] text-center text-stone-400">
                                        Show this card at the counter to collect your stamps!
                                    </p>
                                </div>
                            </div>
                        )}

                        {view === 'adminPanel' && (
                            <div className="max-w-lg w-full bg-white p-6 rounded-2xl shadow-xl space-y-5 border border-stone-200">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h2 className="font-bold text-lg text-orange-600">Admin Panel</h2>
                                    <button onClick={() => setView('home')} className="text-xs font-semibold text-red-500 hover:underline">Back to Home</button>
                                </div>
                                
                                <input 
                                    type="text" 
                                    placeholder="Search mobile number..." 
                                    value={searchTerm} 
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm"
                                />

                                <div className="space-y-3 max-h-64 overflow-y-auto pr-1">
                                    {Object.keys(customers).length === 0 ? (
                                        <p className="text-xs text-center text-stone-400 py-4">No customers found.</p>
                                    ) : (
                                        Object.keys(customers)
                                            .filter(m => m.includes(searchTerm))
                                            .map(m => (
                                                <div key={m} className="p-3 border border-stone-200 rounded-xl bg-stone-50 flex flex-col space-y-2">
                                                    <div className="flex justify-between items-center">
                                                        <div>
                                                            <span className="font-bold text-sm text-stone-800">{m}</span>
                                                            <span className="text-xs text-stone-500 ml-2">(PIN: {customers[m].pin})</span>
                                                        </div>
                                                        <span className="bg-orange-100 text-orange-800 px-2 py-0.5 rounded text-xs font-bold">{customers[m].stamps}/10 Stamps</span>
                                                    </div>
                                                    <div className="grid grid-cols-4 gap-1.5 pt-1">
                                                        <button onClick={() => updateStamps(m, 1)} className="bg-green-600 text-white py-1 rounded text-xs font-bold hover:bg-green-700">+ Stamp</button>
                                                        <button onClick={() => updateStamps(m, -1)} className="bg-amber-600 text-white py-1 rounded text-xs font-bold hover:bg-amber-700">- Stamp</button>
                                                        <button onClick={() => resetCard(m)} className="bg-orange-500 text-white py-1 rounded text-xs font-bold hover:bg-orange-600">Reset</button>
                                                        <button onClick={() => deleteCustomer(m)} className="bg-red-600 text-white py-1 rounded text-xs font-bold hover:bg-red-700">Delete</button>
                                                    </div>
                                                </div>
                                            ))
                                    )}
                                </div>

                                <div className="border-t pt-4 space-y-3">
                                    <h3 className="text-xs font-bold uppercase tracking-wider text-stone-600">Change Admin Password</h3>
                                    <form onSubmit={handleUpdateAdminPassword} className="space-y-2">
                                        <input 
                                            type="password" 
                                            placeholder="Current Admin Password" 
                                            value={currentAdminPassword} 
                                            onChange={(e) => setCurrentAdminPassword(e.target.value)}
                                            className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-xs"
                                            required
                                        />
                                        <input 
                                            type="password" 
                                            placeholder="New Admin Password (min 4 chars)" 
                                            value={newAdminPassword} 
                                            onChange={(e) => setNewAdminPassword(e.target.value)}
                                            className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-xs"
                                            required
                                        />
                                        <button type="submit" className="w-full bg-stone-900 text-white p-2.5 rounded-xl text-xs font-bold hover:bg-stone-800">
                                            Update Password
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {view === 'masterPanel' && (
                            <div className="max-w-lg w-full bg-white p-6 rounded-2xl shadow-xl space-y-5 border border-stone-200">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h2 className="font-bold text-lg text-stone-900">Master Panel (Full Customization)</h2>
                                    <button onClick={() => setView('home')} className="text-xs font-semibold text-red-500 hover:underline">Back</button>
                                </div>
                                <div className="space-y-3 max-h-96 overflow-y-auto pr-1">
                                    <div>
                                        <label className="text-xs font-semibold text-stone-600">Brand Name</label>
                                        <input type="text" value={config.brandName} onChange={(e) => setConfig({...config, brandName: e.target.value})} className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-stone-600">Logo Image URL</label>
                                        <input type="text" value={config.logoUrl} onChange={(e) => setConfig({...config, logoUrl: e.target.value})} className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-stone-600">Hero Title</label>
                                        <input type="text" value={config.heroTitle} onChange={(e) => setConfig({...config, heroTitle: e.target.value})} className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-stone-600">Hero Subtitle</label>
                                        <input type="text" value={config.heroSubtitle} onChange={(e) => setConfig({...config, heroSubtitle: e.target.value})} className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-stone-600">Hero Badge Text</label>
                                        <input type="text" value={config.heroBadgeText} onChange={(e) => setConfig({...config, heroBadgeText: e.target.value})} className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-stone-600">Hero Background Image URL</label>
                                        <input type="text" value={config.heroBgUrl} onChange={(e) => setConfig({...config, heroBgUrl: e.target.value})} className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-stone-600">Footer Text</label>
                                        <input type="text" value={config.footerText} onChange={(e) => setConfig({...config, footerText: e.target.value})} className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-stone-600">Stamp Icon</label>
                                        <input type="text" value={config.stampIcon || '★'} onChange={(e) => setConfig({...config, stampIcon: e.target.value})} className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-stone-600">Reward Icon</label>
                                        <input type="text" value={config.rewardIcon || '🎁'} onChange={(e) => setConfig({...config, rewardIcon: e.target.value})} className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-sm"/>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="text-center p-4 text-xs text-stone-400 border-t bg-white">
                        {config.footerText}
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
