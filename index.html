<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Loyalty Card</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & React DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs for Realtime Database Synchronization -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
    </style>
</head>
<body class="bg-stone-100 text-stone-900 min-h-screen flex flex-col justify-between">
    <div id="root"></div>

    <script type="text/babel">
        // ----------------------------------------------------
        // FIXED FIREBASE CONFIGURATION
        // ----------------------------------------------------
        const DEFAULT_FIREBASE_CONFIG = {
            apiKey: "AIzaSyDY4sGDblR_KBIMTIEZuAerWlLXAn5nZ6I",
            authDomain: "",
            databaseURL: "https://smart-card-bd058-default-rtdb.firebaseio.com",
            projectId: "",
            appId: ""
        };

        function App() {
            const [view, setView] = React.useState('home'); 
            const [mobile, setMobile] = React.useState('');
            const [pin, setPin] = React.useState('');
            const [mobileError, setMobileError] = React.useState('');
            const [secretInput, setSecretInput] = React.useState('');
            
            // Firebase Configuration State - Defaulting to fixed credentials
            const [firebaseConfig, setFirebaseConfig] = React.useState(DEFAULT_FIREBASE_CONFIG);
            const [fbDB, setFbDB] = React.useState(null);

            // Persisted Admin Passcode (Default: 9985656800)
            const [adminPinConfig, setAdminPinConfig] = React.useState(() => {
                return localStorage.getItem('loyalty_admin_pin') || '9985656800';
            });

            const [currentAdminPassword, setCurrentAdminPassword] = React.useState('');
            const [newAdminPassword, setNewAdminPassword] = React.useState('');
            const [toastMessage, setToastMessage] = React.useState('');
            const [toastType, setToastType] = React.useState('info');

            // Master & Branding Config Persistence
            const [config, setConfig] = React.useState(() => {
                const saved = localStorage.getItem('loyalty_master_config');
                return saved ? JSON.parse(saved) : {
                    brandName: "The Copper Skillet",
                    heroBadgeText: "10 stamps = Free Reward",
                    heroTitle: "Craft food, warm welcome — every visit counts.",
                    heroSubtitle: "Collect a stamp on every visit, and your 10th one is on us.",
                    logoUrl: "https://images.unsplash.com/photo-1550547660-d9450f859349?w=100&auto=format&fit=crop&q=80",
                    heroBgUrl: "https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1200",
                    footerText: "© 2026 Digital Loyalty Card. All rights reserved.",
                    stampIcon: "★",
                    rewardIcon: "🎁",
                    cardDescription: "One stamp per visit — 10 stamps unlock your free reward."
                };
            });

            // Customer Records Persistence
            const [customers, setCustomers] = React.useState(() => {
                const saved = localStorage.getItem('loyalty_customers');
                return saved ? JSON.parse(saved) : {};
            });

            const [searchTerm, setSearchTerm] = React.useState('');

            // Initialize Firebase App & Realtime Sync Listener immediately
            React.useEffect(() => {
                if (firebaseConfig && firebaseConfig.databaseURL && window.firebase) {
                    try {
                        if (!firebase.apps.length) {
                            firebase.initializeApp(firebaseConfig);
                        }
                        const db = firebase.database();
                        setFbDB(db);

                        // Listen to real-time changes across all devices instantly
                        const custRef = db.ref('customers');
                        custRef.on('value', (snapshot) => {
                            const val = snapshot.val();
                            if (val) {
                                setCustomers(val);
                                localStorage.setItem('loyalty_customers', JSON.stringify(val));
                            }
                        });

                        const confRef = db.ref('master_config');
                        confRef.on('value', (snapshot) => {
                            const val = snapshot.val();
                            if (val) {
                                setConfig(val);
                                localStorage.setItem('loyalty_master_config', JSON.stringify(val));
                            }
                        });

                        return () => {
                            custRef.off();
                            confRef.off();
                        };
                    } catch (err) {
                        console.error("Firebase init error:", err);
                    }
                }
            }, [firebaseConfig]);

            // Sync updates to Firebase Cloud instantly
            const syncCustomersData = (updatedCustomers) => {
                setCustomers(updatedCustomers);
                localStorage.setItem('loyalty_customers', JSON.stringify(updatedCustomers));
                if (fbDB) {
                    fbDB.ref('customers').set(updatedCustomers);
                }
            };

            const syncMasterConfig = (updatedConfig) => {
                setConfig(updatedConfig);
                localStorage.setItem('loyalty_master_config', JSON.stringify(updatedConfig));
                if (fbDB) {
                    fbDB.ref('master_config').set(updatedConfig);
                }
            };

            React.useEffect(() => {
                localStorage.setItem('loyalty_admin_pin', adminPinConfig);
            }, [adminPinConfig]);

            const showToast = (msg, type = 'info') => {
                setToastMessage(msg);
                setToastType(type);
                setTimeout(() => setToastMessage(''), 3000);
            };

            const validateMobile = (num) => {
                const regex = /^[6-9]\d{9}$/;
                return regex.test(num);
            };

            const handleCustomerLogin = (e) => {
                e.preventDefault();
                if (!validateMobile(mobile)) {
                    setMobileError('Please enter a valid mobile number');
                    return;
                }
                if (!pin || pin.length !== 4) {
                    showToast('Please enter a valid 4-digit PIN.', 'error');
                    return;
                }
                setMobileError('');
                
                if (!customers[mobile]) {
                    const newCust = {
                        ...customers,
                        [mobile]: { pin: pin, stamps: 0, history: [] }
                    };
                    syncCustomersData(newCust);
                    showToast('New Loyalty Card registered successfully!', 'success');
                } else if (customers[mobile].pin !== pin) {
                    showToast('Incorrect PIN! Please try again.', 'error');
                    return;
                } else {
                    showToast('Welcome back!', 'success');
                }
                setView('userDashboard');
            };

            // Immediate Realtime Stamp Update logic
            const updateStamps = (mob, delta) => {
                const current = customers[mob] || { pin: '1234', stamps: 0, history: [] };
                const newStamps = Math.max(0, Math.min(10, current.stamps + delta));
                const updated = {
                    ...customers,
                    [mob]: {
                        ...current,
                        stamps: newStamps,
                        history: [...(current.history || []), { date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), delta: delta > 0 ? `+${delta}` : `${delta}` }]
                    }
                };
                syncCustomersData(updated);
                showToast(`Stamps updated for ${mob}`, 'success');
            };

            const resetCard = (mob) => {
                if (customers[mob]) {
                    const updated = {
                        ...customers,
                        [mob]: { 
                            ...customers[mob], 
                            stamps: 0, 
                            history: [...(customers[mob].history || []), { date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), delta: 'Reset' }] 
                        }
                    };
                    syncCustomersData(updated);
                    showToast(`Stamps reset to 0 for ${mob}`, 'info');
                }
            };

            const deleteCustomer = (mob) => {
                const updated = { ...customers };
                delete updated[mob];
                syncCustomersData(updated);
                showToast(`Customer ${mob} permanently deleted.`, 'error');
            };

            const handleSecretLogin = (e) => {
                e.preventDefault();
                if (secretInput === '7013557763') {
                    setView('masterPanel');
                    setSecretInput('');
                    showToast('Master Panel Unlocked', 'success');
                } else if (secretInput === adminPinConfig) {
                    setView('adminPanel');
                    setSecretInput('');
                    showToast('Admin Panel Unlocked', 'success');
                } else {
                    showToast('Incorrect passcode!', 'error');
                }
            };

            const handleUpdateAdminPassword = (e) => {
                e.preventDefault();
                if (currentAdminPassword !== adminPinConfig) {
                    showToast('Current admin password is incorrect!', 'error');
                    return;
                }
                if (!newAdminPassword || newAdminPassword.length < 10) {
                    showToast('New password must be at least 10 digits long.', 'error');
                    return;
                }
                setAdminPinConfig(newAdminPassword);
                setCurrentAdminPassword('');
                setNewAdminPassword('');
                showToast('Admin password successfully updated!', 'success');
            };

            const handleImageUpload = (e, key) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const updated = { ...config, [key]: reader.result };
                        syncMasterConfig(updated);
                        showToast('Image uploaded successfully!', 'success');
                    };
                    reader.readAsDataURL(file);
                }
            };

            const renderCustomerList = () => (
                <div className="space-y-3 max-h-64 overflow-y-auto custom-scrollbar pr-1">
                    {Object.keys(customers).length === 0 ? (
                        <p className="text-xs text-center text-stone-400 py-6 font-medium">No registered customers found.</p>
                    ) : (
                        Object.keys(customers)
                            .filter(m => m.includes(searchTerm))
                            .map(m => (
                                <div key={m} className="p-3.5 border border-stone-200 rounded-2xl bg-stone-50 flex flex-col space-y-2.5 shadow-sm">
                                    <div className="flex justify-between items-center">
                                        <div className="flex items-center space-x-2">
                                            <span className="font-extrabold text-sm text-stone-800">{m}</span>
                                            <span className="text-xs text-stone-500 font-semibold bg-stone-200 px-2 py-0.5 rounded-md flex items-center space-x-1">
                                                <span>🔑</span>
                                                <span>{customers[m].pin}</span>
                                            </span>
                                        </div>
                                        <span className="bg-orange-100 text-orange-800 px-2.5 py-1 rounded-full text-xs font-bold">
                                            {customers[m].stamps}/10 Stamps
                                        </span>
                                    </div>
                                    <div className="grid grid-cols-4 gap-1.5 pt-1">
                                        <button onClick={() => updateStamps(m, 1)} className="bg-emerald-600 hover:bg-emerald-700 text-white py-1.5 rounded-xl text-xs font-bold transition shadow">+ Stamp</button>
                                        <button onClick={() => updateStamps(m, -1)} className="bg-amber-600 hover:bg-amber-700 text-white py-1.5 rounded-xl text-xs font-bold transition shadow">- Stamp</button>
                                        <button onClick={() => resetCard(m)} className="bg-orange-500 hover:bg-orange-600 text-white py-1.5 rounded-xl text-xs font-bold transition shadow">Reset</button>
                                        <button onClick={() => deleteCustomer(m)} className="bg-red-600 hover:bg-red-700 text-white py-1.5 rounded-xl text-xs font-bold transition shadow">Delete</button>
                                    </div>
                                </div>
                            ))
                    )}
                </div>
            );

            const renderChangeAdminPasswordForm = () => (
                <div className="border-t border-stone-200 pt-4 space-y-3">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-stone-600">Change Admin Password</h3>
                    <form onSubmit={handleUpdateAdminPassword} className="space-y-2">
                        <input 
                            type="password"
                            inputMode="numeric" 
                            placeholder="Current Admin Password" 
                            value={currentAdminPassword} 
                            onChange={(e) => setCurrentAdminPassword(e.target.value)}
                            className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-orange-500"
                            required
                        />
                        <input 
                            type="password"
                            inputMode="numeric" 
                            placeholder="New Admin Password (min 10 digits)" 
                            value={newAdminPassword} 
                            onChange={(e) => setNewAdminPassword(e.target.value)}
                            className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-orange-500"
                            required
                        />
                        <button type="submit" className="w-full bg-stone-900 text-white p-2.5 rounded-xl text-xs font-bold hover:bg-stone-800 transition">
                            Update Admin Password
                        </button>
                    </form>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col justify-between bg-stone-100">
                    <header className="bg-white border-b border-stone-200 px-6 py-3.5 flex justify-between items-center shadow-sm sticky top-0 z-20">
                        <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setView('home')}>
                            <img src={config.logoUrl} alt="Logo" className="w-9 h-9 rounded-full object-cover border border-stone-200 shadow-sm"/>
                            <div>
                                <span className="text-sm font-bold block text-stone-900 leading-tight">{config.brandName}</span>
                                <span className="text-[11px] text-orange-600 font-semibold block">Digital Loyalty Card</span>
                            </div>
                        </div>
                        <div>
                            <button 
                                onClick={() => setView('loginModal')} 
                                className="w-9 h-9 rounded-full bg-stone-900 text-white flex items-center justify-center font-bold text-xs hover:bg-stone-800 shadow transition"
                                title="Admin / Master Portal"
                            >
                                A
                            </button>
                        </div>
                    </header>

                    {toastMessage && (
                        <div className={`fixed top-16 right-4 z-50 px-4 py-3 rounded-xl shadow-lg text-white text-xs font-bold transition-all ${
                            toastType === 'error' ? 'bg-red-600' : toastType === 'success' ? 'bg-emerald-600' : 'bg-stone-800'
                        }`}>
                            {toastMessage}
                        </div>
                    )}

                    <main className="flex-grow flex items-center justify-center p-4">
                        {view === 'home' && (
                            <div className="max-w-4xl w-full grid grid-cols-1 md:grid-cols-2 bg-white rounded-3xl shadow-xl overflow-hidden border border-stone-200">
                                <div className="relative bg-stone-900 min-h-[280px] md:min-h-[460px] bg-cover bg-center flex flex-col justify-between p-8 text-white" style={{ backgroundImage: `url(${config.heroBgUrl})` }}>
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/85 via-black/40 to-black/20"></div>
                                    <div className="relative z-10 space-y-3 mt-auto">
                                        <div className="inline-block bg-orange-600 text-white text-[11px] font-extrabold px-3 py-1 rounded-full shadow">
                                            {config.heroBadgeText}
                                        </div>
                                        <h1 className="text-2xl md:text-3xl font-extrabold leading-tight">{config.heroTitle}</h1>
                                        <p className="text-stone-300 text-xs md:text-sm font-medium">{config.heroSubtitle}</p>
                                    </div>
                                </div>

                                <div className="p-8 md:p-10 flex flex-col justify-center space-y-6 bg-white">
                                    <div className="space-y-1.5">
                                        <h2 className="text-2xl font-bold text-stone-900">Welcome Back</h2>
                                        <p className="text-xs text-stone-500 leading-relaxed">
                                            Enter your 10-digit mobile number and 4-digit PIN to access your card.
                                        </p>
                                    </div>

                                    <form onSubmit={handleCustomerLogin} className="space-y-4">
                                        <div className="space-y-1">
                                            <label className="text-xs font-bold uppercase tracking-wider text-stone-600">Mobile Number</label>
                                            <div className="relative">
                                                <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-stone-400 text-xs">📞</span>
                                                <input 
                                                    type="tel" 
                                                    inputMode="numeric"
                                                    placeholder="10-digit mobile number" 
                                                    value={mobile} 
                                                    onChange={(e) => {
                                                        setMobile(e.target.value.replace(/\D/g, '').slice(0, 10));
                                                        setMobileError('');
                                                    }}
                                                    className="w-full pl-10 pr-4 py-3 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition"
                                                    maxLength="10"
                                                    required
                                                />
                                            </div>
                                            {mobileError && (
                                                <span className="text-red-600 text-[11px] font-bold block pt-1">
                                                    {mobileError}
                                                </span>
                                            )}
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-xs font-bold uppercase tracking-wider text-stone-600">4-Digit PIN</label>
                                            <input 
                                                type="password" 
                                                inputMode="numeric"
                                                placeholder="Enter 4-digit PIN" 
                                                value={pin} 
                                                onChange={(e) => setPin(e.target.value.replace(/\D/g, '').slice(0, 4))}
                                                className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition"
                                                maxLength="4"
                                                required
                                            />
                                        </div>

                                        <button 
                                            type="submit" 
                                            className="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-orange-500/20 transition flex items-center justify-center space-x-2 text-sm mt-2"
                                        >
                                            <span>View My Loyalty Card</span>
                                            <span>→</span>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {view === 'loginModal' && (
                            <div className="max-w-md w-full bg-white p-8 rounded-3xl shadow-xl space-y-5 border border-stone-200">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h2 className="text-lg font-bold text-stone-900">Admin Portal</h2>
                                    <button onClick={() => setView('home')} className="text-xs font-bold text-red-500 hover:underline">Back</button>
                                </div>
                                <p className="text-xs text-stone-500">Enter admin passcode to continue</p>
                                <form onSubmit={handleSecretLogin} className="space-y-4">
                                    <input 
                                        type="password" 
                                        inputMode="numeric"
                                        placeholder="Enter Passcode..." 
                                        value={secretInput} 
                                        onChange={(e) => setSecretInput(e.target.value)}
                                        className="w-full p-3 bg-stone-50 border border-stone-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                                        required
                                    />
                                    <button type="submit" className="w-full bg-stone-900 hover:bg-stone-800 text-white p-3 rounded-xl font-bold text-sm transition shadow">
                                        Login
                                    </button>
                                </form>
                            </div>
                        )}

                        {view === 'userDashboard' && customers[mobile] && (
                            <div className="max-w-md w-full bg-white rounded-3xl shadow-xl overflow-hidden border border-stone-200">
                                <div className="bg-gradient-to-r from-orange-600 to-amber-600 text-white p-6 relative">
                                    <div className="flex justify-between items-start mb-4">
                                        <div>
                                            <h2 className="text-xl font-bold">{config.brandName}</h2>
                                            <p className="text-xs text-orange-100 mt-0.5">{config.cardDescription}</p>
                                        </div>
                                        <button onClick={() => setView('home')} className="text-xs font-semibold bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg backdrop-blur-sm transition">
                                            Switch User
                                        </button>
                                    </div>

                                    <div className="space-y-2 mt-4">
                                        <div className="flex justify-between text-xs font-bold">
                                            <span>{customers[mobile].stamps} / 10 stamps collected</span>
                                            <span>{Math.round((customers[mobile].stamps / 10) * 100)}%</span>
                                        </div>
                                        <div className="w-full bg-black/20 h-2.5 rounded-full overflow-hidden">
                                            <div className="bg-white h-full transition-all duration-500 rounded-full" style={{ width: `${(customers[mobile].stamps / 10) * 100}%` }}></div>
                                        </div>
                                        <div className="flex justify-between items-center pt-2">
                                            <p className="text-[11px] text-orange-100">Account: <strong>{mobile}</strong></p>
                                            <div className="flex items-center space-x-1 bg-white/20 px-2 py-0.5 rounded-md">
                                                <span className="text-[10px]">🔑 PIN:</span>
                                                <span className="text-xs font-bold tracking-widest">{customers[mobile].pin}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="p-6 space-y-6 bg-white">
                                    <div className="grid grid-cols-5 gap-3">
                                        {[...Array(10)].map((_, idx) => {
                                            const isStamped = idx < customers[mobile].stamps;
                                            const isReward = idx === 9;
                                            return (
                                                <div 
                                                    key={idx} 
                                                    className={`h-14 rounded-2xl flex items-center justify-center font-bold text-sm border-2 transition-all duration-300 ${
                                                        isStamped 
                                                            ? 'bg-amber-500 text-white border-amber-600 shadow-md scale-105' 
                                                            : 'bg-stone-50 text-stone-300 border-dashed border-stone-200'
                                                    }`}
                                                >
                                                    {isReward && !isStamped ? (config.rewardIcon || '🎁') : isStamped ? (config.stampIcon || '★') : idx + 1}
                                                </div>
                                            );
                                        })}
                                    </div>
                                    <p className="text-[11px] text-center text-stone-400 font-medium">
                                        Show this card at the counter to collect your stamps!
                                    </p>
                                </div>
                            </div>
                        )}

                        {view === 'adminPanel' && (
                            <div className="max-w-lg w-full bg-white p-6 md:p-8 rounded-3xl shadow-xl space-y-5 border border-stone-200">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h2 className="font-extrabold text-lg text-orange-600">Admin Panel</h2>
                                    <button onClick={() => setView('home')} className="text-xs font-bold text-red-500 hover:underline">Back to Home</button>
                                </div>
                                
                                <input 
                                    type="text" 
                                    placeholder="Search mobile number..." 
                                    value={searchTerm} 
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-orange-500"
                                />

                                {renderCustomerList()}
                                {renderChangeAdminPasswordForm()}
                            </div>
                        )}

                        {view === 'masterPanel' && (
                            <div className="max-w-xl w-full bg-white p-6 md:p-8 rounded-3xl shadow-xl space-y-6 border border-stone-200">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h2 className="font-extrabold text-lg text-stone-900">Master Panel (Full Customization)</h2>
                                    <button onClick={() => setView('home')} className="text-xs font-bold text-red-500 hover:underline">Back</button>
                                </div>

                                <input 
                                    type="text" 
                                    placeholder="Search mobile number..." 
                                    value={searchTerm} 
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-orange-500"
                                />
                                
                                {renderCustomerList()}

                                <div className="space-y-3 max-h-96 overflow-y-auto custom-scrollbar pr-1 border-t pt-4">
                                    <h3 className="text-xs font-bold uppercase tracking-wider text-stone-600">Content & Image Customization</h3>
                                    
                                    <div>
                                        <label className="text-xs font-semibold text-stone-600">Brand Name</label>
                                        <input type="text" value={config.brandName} onChange={(e) => syncMasterConfig({...config, brandName: e.target.value})} className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-xs font-medium"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-stone-600">Upload New Logo (From Gallery)</label>
                                        <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, 'logoUrl')} className="w-full p-2 bg-stone-50 border border-stone-200 rounded-xl text-xs"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-stone-600">Card Description</label>
                                        <input type="text" value={config.cardDescription} onChange={(e) => syncMasterConfig({...config, cardDescription: e.target.value})} className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-xs font-medium"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-stone-600">Hero Title</label>
                                        <input type="text" value={config.heroTitle} onChange={(e) => syncMasterConfig({...config, heroTitle: e.target.value})} className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-xs font-medium"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-stone-600">Hero Subtitle</label>
                                        <input type="text" value={config.heroSubtitle} onChange={(e) => syncMasterConfig({...config, heroSubtitle: e.target.value})} className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-xs font-medium"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-stone-600">Hero Badge Text</label>
                                        <input type="text" value={config.heroBadgeText} onChange={(e) => syncMasterConfig({...config, heroBadgeText: e.target.value})} className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-xs font-medium"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-stone-600">Upload New Hero Background (From Gallery)</label>
                                        <input type="file" accept="image/*" onChange={(e) => handleImageUpload(e, 'heroBgUrl')} className="w-full p-2 bg-stone-50 border border-stone-200 rounded-xl text-xs"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-stone-600">Footer Text</label>
                                        <input type="text" value={config.footerText} onChange={(e) => syncMasterConfig({...config, footerText: e.target.value})} className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-xs font-medium"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-stone-600">Stamp Icon</label>
                                        <input type="text" value={config.stampIcon || '★'} onChange={(e) => syncMasterConfig({...config, stampIcon: e.target.value})} className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-xs font-medium"/>
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-stone-600">Reward Icon</label>
                                        <input type="text" value={config.rewardIcon || '🎁'} onChange={(e) => syncMasterConfig({...config, rewardIcon: e.target.value})} className="w-full p-2.5 bg-stone-50 border border-stone-200 rounded-xl text-xs font-medium"/>
                                    </div>
                                </div>

                                {renderChangeAdminPasswordForm()}
                            </div>
                        )}
                    </main>

                    <footer className="text-center p-4 text-xs font-medium text-stone-400 border-t border-stone-200 bg-white">
                        {config.footerText}
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
